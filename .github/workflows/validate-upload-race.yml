name: Validate binary upload behavior
on:
  push:
    branches: [review/upload-race-and-cancellation-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check static/js/index.js
      - run: node --test tests/js/upload.test.cjs
